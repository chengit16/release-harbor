<!doctype html>
<!-- 独立的海岸插画：HTML 负责画册排版，SVG 包含完整画面，可单独复制使用。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="一幅描绘鹈鹕沿海岸骑自行车的复古风格矢量插画。" />
    <title>鹈鹕骑行记 · 海岸图鉴</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f5eedf;
        --ink: #203a38;
        --muted: #525d51;
        --rule: #c9bfaa;
        --red: #a84736;
        --serif: 'Songti SC', 'Noto Serif CJK SC', 'STSong', SimSun, serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .album {
        width: min(1100px, calc(100% - 88px));
        margin-inline: auto;
        padding-block: 28px 30px;
      }

      .masthead,
      .heading,
      .caption {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
      }

      .masthead {
        align-items: center;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--rule);
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.18em;
      }

      .series {
        display: inline-flex;
        align-items: center;
        gap: 9px;
      }

      .series svg {
        width: 16px;
        height: 16px;
        color: var(--red);
      }

      .heading {
        align-items: end;
        padding-block: 18px 20px;
      }

      h1 {
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(2.5rem, 5.2vw, 4.6rem);
        font-weight: 800;
        line-height: 1.12;
        letter-spacing: -0.055em;
      }

      .lede {
        margin: 0 0 3px;
        color: var(--muted);
        font-family: var(--serif);
        font-size: 15px;
        font-weight: 600;
        line-height: 1.65;
      }

      figure {
        margin: 0;
      }

      .artwork {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #827d68;
      }

      .caption {
        align-items: center;
        padding-top: 11px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
      }

      .medium {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .palette {
        display: inline-flex;
        gap: 3px;
      }

      .palette i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--swatch);
      }

      @media (max-width: 580px) {
        .album {
          width: calc(100% - 32px);
          padding-block: 19px 24px;
        }

        .heading {
          flex-direction: column;
          align-items: start;
          gap: 7px;
          padding-block: 17px 15px;
        }

        .lede {
          margin: 0;
          font-size: 13px;
        }

        .lede br {
          display: none;
        }
      }
    </style>
  </head>
